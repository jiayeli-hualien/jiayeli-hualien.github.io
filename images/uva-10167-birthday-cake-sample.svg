<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" role="img" aria-labelledby="title desc">
  <title id="title">UVa 10167 官方範例：以 y = 0 平分櫻桃</title>
  <desc id="desc">圓形蛋糕以原點為中心，紅色水平線 y = 0 通過圓心。綠色箭頭是係數向量 (A, B) = (0, 1)，垂直於切割線。藍色櫻桃位於直線上方，橘色櫻桃位於下方，兩側各兩顆，線上沒有櫻桃。右側列出四個座標與內積值。</desc>
  <style>
    text { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #344054; }
    .title { font-size: 19px; font-weight: 600; }
    .label { font-size: 14px; }
    .small { font-size: 13px; fill: #596579; }
    .axis { stroke: #98a2b3; stroke-width: 1.2; }
    .cake { fill: #fffdf7; stroke: #667085; stroke-width: 2; }
    .positive { fill: #2563eb; stroke: #ffffff; stroke-width: 2; }
    .negative { fill: #d97706; stroke: #ffffff; stroke-width: 2; }
    .cut { stroke: #b42318; stroke-width: 3; }
    .normal { stroke: #039855; stroke-width: 3; }
    .normal-label { font-size: 13px; fill: #027a48; }
  </style>

  <defs>
    <marker id="normal-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#039855" />
    </marker>
  </defs>

  <text x="410" y="34" text-anchor="middle" class="title">官方範例：切割線 y = 0</text>

  <circle cx="300" cy="260" r="185" class="cake" />
  <line x1="300" y1="70" x2="300" y2="450" class="axis" stroke-dasharray="4 5" />
  <line x1="110" y1="260" x2="490" y2="260" class="axis" stroke-dasharray="4 5" />
  <line x1="115" y1="260" x2="485" y2="260" class="cut" />
  <line x1="300" y1="260" x2="300" y2="154" class="normal" marker-end="url(#normal-arrow)" />
  <rect x="300" y="246" width="14" height="14" fill="#fffdf7" stroke="#039855" stroke-width="1.5" />
  <text x="315" y="169" class="normal-label">(A, B)</text>

  <text x="309" y="82" class="small">y</text>
  <text x="490" y="280" class="small">x</text>
  <text x="310" y="278" class="small">(0, 0)</text>
  <text x="430" y="250" class="small" fill="#b42318">y = 0</text>

  <circle cx="264" cy="224" r="7" class="positive" />
  <text x="271" y="212" class="small">1</text>
  <circle cx="246" cy="224" r="7" class="positive" />
  <text x="228" y="212" class="small">2</text>
  <circle cx="282" cy="350" r="7" class="negative" />
  <text x="263" y="372" class="small">3</text>
  <circle cx="318" cy="269" r="7" class="negative" />
  <text x="328" y="289" class="small">4</text>

  <text x="530" y="91" class="label" font-weight="600">(A, B) = (0, 1)</text>
  <text x="530" y="116" class="small">內積值：Ax + By = y</text>

  <circle cx="537" cy="157" r="6" class="positive" />
  <text x="552" y="162" class="label">y &gt; 0：上側 2 顆</text>
  <circle cx="537" cy="190" r="6" class="negative" />
  <text x="552" y="195" class="label">y &lt; 0：下側 2 顆</text>
  <line x1="530" y1="224" x2="548" y2="224" class="cut" />
  <text x="558" y="229" class="label">y = 0：線上 0 顆</text>

  <text x="530" y="278" class="small" font-weight="600">點</text>
  <text x="562" y="278" class="small" font-weight="600">座標</text>
  <text x="738" y="278" class="small" font-weight="600">Ax+By</text>
  <circle cx="536" cy="303" r="5" class="positive" />
  <text x="550" y="308" class="small">1</text>
  <text x="562" y="308" class="small">(-20, 20)</text>
  <text x="750" y="308" class="small">20</text>
  <circle cx="536" cy="329" r="5" class="positive" />
  <text x="550" y="334" class="small">2</text>
  <text x="562" y="334" class="small">(-30, 20)</text>
  <text x="750" y="334" class="small">20</text>
  <circle cx="536" cy="355" r="5" class="negative" />
  <text x="550" y="360" class="small">3</text>
  <text x="562" y="360" class="small">(-10, -50)</text>
  <text x="750" y="360" class="small">-50</text>
  <circle cx="536" cy="381" r="5" class="negative" />
  <text x="550" y="386" class="small">4</text>
  <text x="562" y="386" class="small">(10, -5)</text>
  <text x="750" y="386" class="small">-5</text>
</svg>
